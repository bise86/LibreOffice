name: Android ARM64 release

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_API_LEVEL: '29'
      ANDROID_NDK_VERSION: 27.2.12479018

    steps:
      - name: Check out LibreOffice
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and native build dependencies
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake bison build-essential ccache flex gperf libarchive-zip-perl \
            libbz2-dev libc6-dev libcap-dev libcurl4-openssl-dev libfontconfig1-dev \
            libfreetype6-dev libkrb5-dev libldap2-dev libltdl-dev libnss3-dev \
            libpng-dev libssl-dev libtool libx11-dev libx11-xcb-dev libxext-dev \
            libxinerama-dev libxrandr-dev \
            libxrender-dev libxcb1-dev m4 nasm pkg-config python3-dev python3-setuptools \
            rsync unzip xsltproc zip zlib1g-dev
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Configure the Android ARM64 build
        shell: bash
        run: |
          cat > autogen.input <<EOF
          --with-distro=LibreOfficeAndroidAarch64
          --with-android-sdk=${ANDROID_SDK_ROOT}
          --with-android-ndk=${ANDROID_NDK_HOME}
          --with-android-api-level=${ANDROID_API_LEVEL}
          --with-jdk-home=${JAVA_HOME}
          --enable-android-editing
          --enable-pdfimport
          --enable-pdfium
          --enable-release-build
          --enable-ccache
          EOF
          ./autogen.sh

      - name: Build the editing APK
        shell: bash
        run: |
          make -j2 versionCode="${GITHUB_RUN_NUMBER}" build

      - name: Collect APK and checksum
        id: apk
        shell: bash
        run: |
          apk="$(find android/app/build/outputs/apk/strippedUIEditing/release \
            -maxdepth 1 -type f -name '*-release-unsigned.apk' -print -quit)"
          test -n "${apk}"
          mkdir -p dist
          output="dist/LibreOffice-Android-arm64-v${GITHUB_REF_NAME#android-v}.apk"
          cp "${apk}" "${output}"
          sha256sum "${output}" > "${output}.sha256"
          echo "path=${output}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libreoffice-android-arm64
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "LibreOffice Android ARM64 ${GITHUB_REF_NAME#android-v}" \
              --generate-notes
          fi
